# Usage:
#   tmuxinator start dev <branch> [options]
#
# Options:
#   -be,  --backend <branch>      Backend branch (defaults to frontend branch)
#   -w,   --web [branch]          Include bertie-web repo (off unless passed). Branch optional: defaults to frontend branch.
#   -d,   --docker <n>            Docker instance number (auto-detected if omitted)
#   -b,   --base <branch>         Base branch for both repos (default: HEAD)
#   -bfe, --base-fe <branch>      Base branch for frontend only
#   -bbe, --base-be <branch>      Base branch for backend only
#   -r,   --rebase                Rebase existing worktrees onto base branch instead of branching off
#
# Examples:
#   tmuxinator start dev feat/my-feature                              # both repos, docker=1
#   tmuxinator start dev feat/my-feature -d 2                         # both repos, docker=2
#   tmuxinator start dev bdesk-payment-match -be bb-bdx               # separate branches
#   tmuxinator start dev feat/my-feature -w feat/web-branch           # include bertie-web
#   tmuxinator start dev feat/my-feature -b develop                   # both off develop
#   tmuxinator start dev feat/my-feature -bfe feat/fe-base -bbe feat/be-base  # separate bases
#   tmuxinator start dev feat/my-feature -b develop -r                # rebase existing onto develop

<%
  listening_ports = `netstat -an -p tcp 2>/dev/null`.scan(/[.:](\d+)\s+\S+\s+LISTEN/).flatten.map(&:to_i).uniq
  port_free = ->(port) { !listening_ports.include?(port) }

  opts = {}
  positional = []
  i = 0
  while i < @args.length
    case @args[i]
    when '--backend', '-be'
      opts[:backend] = @args[i + 1]; i += 2
    when '--web', '-w'
      nxt = @args[i + 1]
      if nxt && !nxt.start_with?('-')
        opts[:web] = nxt; i += 2
      else
        opts[:web] = :default; i += 1
      end
    when '--docker', '-d'
      opts[:docker] = @args[i + 1]; i += 2
    when '--base', '-b'
      opts[:base] = @args[i + 1]; i += 2
    when '--base-fe', '-bfe'
      opts[:base_fe] = @args[i + 1]; i += 2
    when '--base-be', '-bbe'
      opts[:base_be] = @args[i + 1]; i += 2
    when '--rebase', '-r'
      opts[:rebase] = true; i += 1
    when '--desktop-local', '-l'
      opts[:desktop_local] = true; i += 1
    else
      positional << @args[i]; i += 1
    end
  end

  frontend_branch = positional[0]
  backend_branch = opts[:backend] || frontend_branch
  # Starts at 1: instance 0 would put the backend on 3000 and postgres on 5432,
  # which the fixed auth stack (auth server + its docker-compose) always occupies.
  docker_instance = opts[:docker] ? opts[:docker].to_i : (1..).find { |n| port_free.(5432 + n) && port_free.(3000 + n) }
  base_fe = opts[:base_fe] || opts[:base]
  base_be = opts[:base_be] || opts[:base]
  rebase = opts[:rebase] ? "1" : ""

  # Run the Electron app on the machine you are sitting at, while the rest of the
  # stack stays here. The -R forwards make this host's backend/postgres/auth
  # appear on the remote's localhost at the same ports, so the app's .env needs
  # no changes. Requires a checkout with node_modules over there: better-sqlite3
  # is rebuilt per platform, so the tree cannot be shared.
  desktop_local = opts[:desktop_local] ? true : false
  desktop_host = nil
  if desktop_local
    host_file = File.expand_path("~/.config/tmuxinator/desktop-host")
    unless File.exist?(host_file)
      raise "--desktop-local needs an ssh target in #{host_file} (one line, e.g. macbook)"
    end
    desktop_host = File.read(host_file).lines.first.to_s.strip
    raise "#{host_file} is empty" if desktop_host.empty?
  end
  postgres_port = 5432 + docker_instance
  backend_port = 3000 + docker_instance
  fe_slug = frontend_branch.gsub('/', '-')
  be_slug = backend_branch.gsub('/', '-')
  web_branch = opts[:web] == :default ? frontend_branch : opts[:web]
  web_slug = web_branch&.gsub('/', '-')
  # Absolute, not "~/...": on_project_start interpolates these into quoted shell
  # words, where a tilde is not expanded. That silently wrote the generated .env
  # files into a literal "~" directory under tmuxinator's cwd instead of the
  # worktrees, so the backend never saw its POSTGRES_PORT/BACKEND_PORT.
  bertie_root = File.expand_path("~/Documents/bertie")
  frontend_root = "#{bertie_root}/bertie-desktop/#{fe_slug}"
  backend_root = "#{bertie_root}/bertie-backend/#{be_slug}"
  packages_root = "#{bertie_root}/bertie-packages/#{fe_slug}"
  web_root = web_branch ? "#{bertie_root}/bertie-web/#{web_slug}" : nil

  # Find each repo's base checkout rather than hardcoding a folder name. The
  # base clone has .git as a *directory*; linked worktrees have .git as a file
  # pointing back at it, so this picks the clone whatever it is called.
  base_of = lambda do |repo|
    found = Dir.glob("#{bertie_root}/#{repo}/*").find do |p|
      File.directory?(File.join(p, ".git"))
    end
    raise "no base checkout found in #{bertie_root}/#{repo} — clone it first" if found.nil?
    found
  end

  auth_root = base_of.call("bertie-auth")
  auth_port = 3000
  auth_url = "http://localhost:#{auth_port}"
  frontend_main = base_of.call("bertie-desktop")
  backend_main = base_of.call("bertie-backend")
  packages_main = base_of.call("bertie-packages")
  web_main = web_branch ? base_of.call("bertie-web") : nil
%>

name: <%= frontend_branch %>

on_project_start:
  - ~/.config/tmuxinator/scripts/ensure-worktree.sh "<%= frontend_main %>" "<%= frontend_root %>" "<%= frontend_branch %>"<%= base_fe ? " \"#{base_fe}\"" : "" %><%= rebase.empty? ? "" : " --rebase" %>
  - ~/.config/tmuxinator/scripts/ensure-worktree.sh "<%= backend_main %>" "<%= backend_root %>" "<%= backend_branch %>"<%= base_be ? " \"#{base_be}\"" : "" %><%= rebase.empty? ? "" : " --rebase" %>
  - ~/.config/tmuxinator/scripts/ensure-worktree.sh "<%= packages_main %>" "<%= packages_root %>" "<%= frontend_branch %>"<%= base_fe ? " \"#{base_fe}\"" : "" %><%= rebase.empty? ? "" : " --rebase" %>
<% if web_branch %>  - ~/.config/tmuxinator/scripts/ensure-worktree.sh "<%= web_main %>" "<%= web_root %>" "<%= web_branch %>"<%= base_fe ? " \"#{base_fe}\"" : "" %><%= rebase.empty? ? "" : " --rebase" %>
<% end %>  - mkdir -p "<%= backend_root %>/tmp" && printf 'POSTGRES_PORT=<%= postgres_port %>\nBACKEND_PORT=<%= backend_port %>\nDOCKER_INSTANCE=<%= docker_instance %>\nFRONTEND_ROOT=<%= frontend_root %>\nBACKEND_ROOT=<%= backend_root %>\nPACKAGES_ROOT=<%= packages_root %>\n<%= web_root ? "WEB_ROOT=#{web_root}\\n" : "" %>' > "<%= backend_root %>/tmp/.env"
<% if web_branch %>  - mkdir -p "<%= web_root %>/tmp" && printf 'BACKEND_URL=http://localhost:<%= backend_port %>\nAUTH_URL=<%= auth_url %>\n' > "<%= web_root %>/tmp/.env"
  - f="<%= web_root %>/.env"; touch "$f"; grep -q '^BERTIE_BACKEND_PROXY_URL=' "$f" && sed -i '' 's|^BERTIE_BACKEND_PROXY_URL=.*|BERTIE_BACKEND_PROXY_URL=http://localhost:<%= backend_port %>|' "$f" || printf 'BERTIE_BACKEND_PROXY_URL=http://localhost:<%= backend_port %>\n' >> "$f"
<% end %>
  - ~/.config/tmuxinator/scripts/generate-repos-txt.sh "<%= frontend_branch %>" "<%= backend_branch %>" "<%= frontend_branch %>" "<%= web_branch %>"

windows:
  - bbs:
      root: <%= backend_root %>
      layout: tiled
      panes:
        - DOCKER_SUFFIX=<%= docker_instance %> POSTGRES_PORT=<%= postgres_port %> docker-compose -p bertie-backend-<%= be_slug.downcase %> up
        - cd <%= auth_root %> && docker-compose up
        - pnpm i && POSTGRES_PORT=<%= postgres_port %> pnpm db:setup && POSTGRES_PORT=<%= postgres_port %> pnpm dev -p <%= backend_port %>
        - cd <%= auth_root %> && POSTGRES_PORT=5432 npm i && BACKEND_SERVER_URL=http://localhost:<%= backend_port %> PORT=<%= auth_port %> npm run dev

  - bb:
      root: <%= backend_root %>
      layout: even-horizontal
      panes:
        - nvim
        - claude

  - bd:
      root: <%= frontend_root %>
      layout: even-horizontal
      panes:
        - nvim
<% if desktop_local %>        - ssh -R <%= backend_port %>:localhost:<%= backend_port %> -R <%= postgres_port %>:localhost:<%= postgres_port %> -R <%= auth_port %>:localhost:<%= auth_port %> <%= desktop_host %> 'cd ~/Documents/bertie/bertie-desktop/<%= fe_slug %> && npm run dev'
<% end %>        - claude

  - bds:
      root: <%= frontend_root %>
      panes:
        - npm i
        - sqlitbd

  # - sqlbd:
  #     root: <%= frontend_root %>
  #     panes:
  #       -

  - sqlbb:
      root: <%= backend_root %>
      panes:
        - sleep 5 && sqlitbb <%= postgres_port %>

  - bp:
      root: <%= packages_root %>
      layout: even-horizontal
      panes:
        - nvim
        - npm i && claude

<% if web_branch %>  - bw:
      root: <%= web_root %>
      layout: even-horizontal
      panes:
        - nvim
        - claude
        - npm i
<% end %>

