# Advertise a terminal every host knows. Inheriting the outer $TERM instead
# (xterm-ghostty here) breaks ssh out of tmux to any machine without Ghostty's
# terminfo installed — backspace and arrows stop working there.
set-option -g default-terminal 'tmux-256color'
# Truecolor is enabled per *outer* terminal name, so it has to list ghostty too.
set-option -ga terminal-overrides ',xterm-256color:RGB,xterm-ghostty:RGB'

set -sg escape-time 0
set -g mouse on
set -g prefix ^space
set -g base-index 1              # start indexing windows at 1 instead of 0
setw -g pane-base-index 1        # start indexing panes at 1 instead of 0
set -g detach-on-destroy off     # don't exit from tmux when closing a session
set -g escape-time 0             # zero-out escape time delay
set -g history-limit 1000000     # increase history size (from 2,000)
set -g renumber-windows on       # renumber all windows when any window is closed
set -g set-clipboard on          # use system clipboard
# tmux-yank pipes copies to this instead of pbcopy; it skips pbcopy over ssh.
set -g @override_copy_command '~/.config/tmux/scripts/copy.sh'
set -g status-position top       # macOS / darwin style
# set -g status-position bottom
set -g status-left-length 50
set -g status-right-length 100
setw -g mode-keys vi
set -g pane-active-border-style 'fg=magenta,bg=default'
set -g pane-border-style 'fg=brightblack,bg=default'
set -g message-style 'fg=#cdd6f4,bg=default'
set -g message-command-style 'fg=#cdd6f4,bg=default'

set -g @fzf-url-fzf-options '-p 60%,30% --prompt="   " --border-label=" Open URL " --header="enter open · ctrl-y copy"'
set -g @fzf-url-history-limit '2000'
# Enter opens the link in the laptop's browser, not on the mini.
set -g @fzf-url-open '~/.config/tmux/scripts/open-on-laptop.sh'
# ctrl-y copies the link to the laptop's clipboard, not the mini's.
set -g @fzf-url-copy-cmd '~/.config/tmux/scripts/copy-on-laptop.sh'
# tmux-urlview also defaults to prefix+u, and loads before fzf-url, so it lost
# the binding outright. Moved so both plugins are reachable.
set -g @urlview-key 'C-u'

# Plugins (theme plugin should be added in theme config)
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'tmux-plugins/tmux-yank'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'
set -g @plugin 'fcsonline/tmux-thumbs'
set -g @plugin 'tmux-plugins/tmux-urlview'
set -g @plugin 'sainnhe/tmux-fzf'
set -g @plugin 'wfxr/tmux-fzf-url'
set -g @plugin 'omerxx/tmux-sessionx'

# Floax is off for now: prefix+p is the OpenRig dashboard instead (below).
# Uncomment to bring it back; prefix+P is then its menu again.
# set -g @plugin 'omerxx/tmux-floax'
# set -g @floax-width '80%'
# set -g @floax-height '80%'
# set -g @floax-border-color 'magenta'
# set -g @floax-text-color 'blue'
# set -g @floax-bind 'p'
# set -g @floax-change-path 'true'

# OpenRig dashboard (rig tui) in a popup that keeps its state, like floax's
# scratch: prefix+p shows or hides it, q in the dashboard quits it.
bind p run-shell -b "~/.config/tmux/scripts/rig-tui.sh --toggle '#{client_name}'"
set-hook -g session-created 'if-shell "[ #{session_name} = scratch ]" "set status on"'
# OpenRig sets `status off` on every <seat>@<rig> session after creating it, so a
# session-created hook is too early. Drop that override on the way in instead.
set-hook -g client-session-changed 'if -F "#{m:*@*,#{session_name}}" "set -u status"'

set -g @sessionx-bind-zo-new-window 'ctrl-y'
set -g @sessionx-auto-accept 'off'
set -g @sessionx-custom-paths '/Users/eddietindame/Documents/code/'
set -g @sessionx-bind 'o'
set -g @sessionx-window-height '85%'
set -g @sessionx-window-width '75%'
set -g @sessionx-zoxide-mode 'on'
set -g @sessionx-custom-paths-subdirectories 'false'
set -g @sessionx-filter-current 'false'
set -g @continuum-restore 'on'
set -g @continuum-save-interval '15'
set -g @resurrect-strategy-nvim 'session'
# Appended to resurrect's built-in list (vim/nvim/less/top/…), not a replacement.
# Leading ~ prefix-matches the command and restores it with its arguments, so
# `pnpm dev -p 3002` and each `docker-compose -p <project> up` return intact.
set -g @resurrect-processes '"~npm run" "~pnpm" "~docker-compose"'
# Leave OpenRig agent sessions (<seat>@<rig>) out of saves; see the script.
set -g @resurrect-hook-post-save-layout '~/.config/tmux/scripts/resurrect-drop-rig.sh'
set -g allow-rename off
set -g automatic-rename off

bind D source-file ~/.config/tmux/layouts/dev.tmux
bind Z run-shell '~/.config/tmux/scripts/zen-mode.sh'
bind T command-prompt -p "Branch:" "run-shell 'tmuxinator start dev %1'"

