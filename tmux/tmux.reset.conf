# First remove *all* keybindings
unbind-key -a
# Now reinsert all the regular tmux keys
bind ^X lock-server
# In an OpenRig seat session (<pod>-<seat>@<rig>) a second pane or a window in
# front of the agent makes OpenRig refuse to deliver messages and queue wakes
# to it ("does not have the single expected bound pane"), so the lead never
# hears that builders finished. There, splits and new windows open a popup
# shell instead: it's gone when you exit it, but it isn't a pane.
RIG_SEAT='#{m:*@*,#{session_name}}'
RIG_POPUP='display-popup -E -w 90% -h 85%'
bind ^N if -F "$RIG_SEAT" "$RIG_POPUP -d '$HOME'" 'new-window -c "$HOME"'
bind ^D detach
bind C-a list-clients   # not *, which line ~44 rebinds to synchronize-panes

bind H previous-window
bind L next-window

bind 0 select-window -t :0
bind 1 select-window -t :1
bind 2 select-window -t :2
bind 3 select-window -t :3
bind 4 select-window -t :4
bind 5 select-window -t :5
bind 6 select-window -t :6
bind 7 select-window -t :7
bind 8 select-window -t :8
bind 9 select-window -t :9

bind r command-prompt "rename-window %%"
bind R source-file ~/.config/tmux/tmux.conf
bind Tab last-window
bind ^W list-windows
bind w list-windows
bind z resize-pane -Z
bind ^L refresh-client
# bind l refresh-client
bind | if -F "$RIG_SEAT" "$RIG_POPUP -d '#{pane_current_path}'" split-window
bind s if -F "$RIG_SEAT" "$RIG_POPUP -d '#{pane_current_path}'" 'split-window -v -c "#{pane_current_path}"'
bind v if -F "$RIG_SEAT" "$RIG_POPUP -d '#{pane_current_path}'" 'split-window -h -c "#{pane_current_path}"'
bind '"' choose-window
bind h if-shell -F '#{window_zoomed_flag}' 'select-pane -L; resize-pane -Z' 'select-pane -L'
bind j if-shell -F '#{window_zoomed_flag}' 'select-pane -D; resize-pane -Z' 'select-pane -D'
bind k if-shell -F '#{window_zoomed_flag}' 'select-pane -U; resize-pane -Z' 'select-pane -U'
bind l if-shell -F '#{window_zoomed_flag}' 'select-pane -R; resize-pane -Z' 'select-pane -R'
bind -r -T prefix , resize-pane -L 20
bind -r -T prefix . resize-pane -R 20
bind -r -T prefix - resize-pane -D 7
bind -r -T prefix = resize-pane -U 7
bind : command-prompt
bind * setw synchronize-panes
bind P set pane-border-status
bind c kill-pane
bind x swap-pane -D
# OpenRig names its agent sessions <seat>@<rig>; keep them out of the normal
# list (S) and give them their own (A).
# rig-tui is the hidden session behind the prefix+p dashboard popup.
bind S choose-tree -s -f '#{?#{||:#{m:*@*,#{session_name}},#{==:#{session_name},rig-tui}},0,1}'
# Rig seats (OpenRig sessions, see scripts/rig-switch.sh):
#   A  fzf picker: rig leads (←/→ for their seats), tab for every seat
#   g  back to the last lead you were in
#   N  next seat waiting on you
#   a  the agent that last rang (scripts/agent-notify.sh)
#   M  menu: which agents alert you (scripts/agent-notify.sh)
bind A run-shell -b "~/.config/tmux/scripts/rig-switch.sh --open '#{client_name}'"
bind g run-shell -b "~/.config/tmux/scripts/rig-switch.sh --last-lead '#{client_name}'"
bind N run-shell -b "~/.config/tmux/scripts/rig-switch.sh --next-input '#{client_name}'"
bind a run-shell -b "~/.config/tmux/scripts/rig-switch.sh --last-alert '#{client_name}'"
# Which agent alerts reach you: checkboxes, see scripts/agent-notify.sh
bind M run-shell -b "~/.config/tmux/scripts/agent-notify.sh --menu '#{client_name}'"
bind R source-file ~/.config/tmux/tmux.conf
bind [ copy-mode
bind-key -T copy-mode-vi v send-keys -X begin-selection
bind-key -T copy-mode-vi MouseDragEnd1Pane send-keys -X copy-pipe "pbcopy"

# Change directory of all panes in current window (kills running programs first)
bind C command-prompt -p "cd to:" "run-shell 'for pane in $(tmux list-panes -F \"##{pane_id}\"); do tmux send-keys -t \$pane C-c; sleep 0.1; tmux send-keys -t \$pane \"cd %1\" Enter; done'"
# Clear screen + scrollback for current pane (cmd+K equivalent, works while a process is running)
# On C-k, not k — k is vim-style select-pane -U above, which this used to shadow.
bind C-k send-keys -R \; clear-history
# Clear scrollback in all panes in current window
bind K run-shell 'for pane in $(tmux list-panes -F "##{pane_id}"); do tmux send-keys -t $pane clear Enter; done'

